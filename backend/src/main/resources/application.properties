# Name shown in logs.
spring.application.name=backend

# The API runs on port 8080 (the frontend runs on 3000).
server.port=8080

# Where MongoDB is running and which database to use.
# The database and collection are created automatically on first write.
spring.mongodb.uri=mongodb://localhost:27017/campaign_dashboard

# Which website is allowed to call this API from the browser (CORS).
# Read by WebConfig.java. Comma-separate if you need more than one.
app.cors.allowed-origins=http://localhost:3000
